name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes the run in flight for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # The admin suite is deliberately integration-first: it asserts against a
    # real MongoDB rather than a mock, because the things worth testing here are
    # uniqueness, embedded-document shape and transactions, and a mock has none.
    #
    # MongoDB transactions need a replica set, and a GitHub `services:` container
    # cannot be given the `--replSet` flag, so Mongo is started here as a step
    # and initiated as a single-node set — mirroring the dev docker-compose.
    env:
      MONGODB_URI: mongodb://localhost:27017/orbit_admin?directConnection=true
      MONGO_DB: orbit_admin
      # Order intake refuses writes without it, so the suite needs one set.
      ORBIT_WRITE_TOKEN: ci-write-token
      MEDIA_DIR: ${{ github.workspace }}/.ci-media

    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 \
            --replSet rs0 --bind_ip_all
          # Wait for mongod to accept connections.
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.adminCommand("ping")' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          # Wait until a writable primary is elected.
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then
              break
            fi
            sleep 1
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Ensure indexes
        run: npm run db:indexes

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Unit, integration, and the axe accessibility checks that ORB-106 asks
      # for — they live in the same suite, so a11y cannot be skipped without
      # skipping the tests.
      - name: Test
        run: npm test
