name: orbit

# Only Caddy publishes ports to the host. Postgres and the two Next.js apps are
# reachable exclusively over the private `orbit-net` bridge network.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit}
      POSTGRES_DB: ${POSTGRES_DB:-orbit_admin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - orbit-net
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbit} -d ${POSTGRES_DB:-orbit_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  orbit-admin:
    build:
      context: .
      dockerfile: apps/orbit-admin/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-orbit}:${POSTGRES_PASSWORD:-orbit}@postgres:5432/${POSTGRES_DB:-orbit_admin}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orbit-net
    expose:
      - "3000"
    healthcheck:
      # Becomes healthy only once boot migrations complete (/api/health -> 200).
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Storefront reads Orbit data only via @orbit/next, pointed at the admin.
      ORBIT_API_URL: http://orbit-admin:3000
    depends_on:
      orbit-admin:
        condition: service_healthy
    networks:
      - orbit-net
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      orbit-admin:
        condition: service_healthy
      storefront:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 (QUIC)
    environment:
      STOREFRONT_DOMAIN: ${STOREFRONT_DOMAIN:-localhost}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - orbit-net

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  orbit-net:
    driver: bridge
