# Local development overrides (auto-merged by `docker compose`).
#
# Publishes Postgres to the host so the host-run dev server (`npm run dev`),
# drizzle-kit migrations and the seed script can reach it at localhost:5432.
# Credentials come from the root .env (single source of truth) — see .env.template.
#
# NOT for production: on a server, run with only the base file
# (`docker compose -f docker-compose.yml up`) so Postgres stays internal.

services:
  postgres:
    ports:
      - "5432:5432"
