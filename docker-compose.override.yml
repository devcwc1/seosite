# Local development overrides (auto-merged by `docker compose`).
#
# Publishes MongoDB to the host so the host-run dev server (`npm run dev`) and
# the seed script can reach it at localhost:27017. Credentials/URI come from the
# root .env (single source of truth) — see .env.template.
#
# NOT for production: on a server, run with only the base file
# (`docker compose -f docker-compose.yml up`) so MongoDB stays internal.

services:
  mongo:
    ports:
      - "27017:27017"
